<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Content Management System — DigitalBrief</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase Auth SDK & Client Engine -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/static/js/supabase_auth.js"></script>

    <style>
        :root {
            --bg-body: #07090e;
            --bg-card: #0e131f;
            --bg-card-hover: #141c2e;
            --border-color: #1e293b;
            --accent-primary: #6366f1;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: var(--font-main);
            line-height: 1.6;
        }

        header {
            background: #04060a;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 0;
        }
        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .container {
            max-width: 1280px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Stats Bar */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }
        .stat-val {
            font-size: 2rem;
            font-weight: 800;
            margin-top: 4px;
            color: var(--text-primary);
        }
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Controls / Filter Bar */
        .controls-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="text"], select, textarea {
            background: #07090e;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--accent-primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent-primary); color: #fff; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-green { background: var(--accent-green); color: #fff; }
        .btn-green:hover { background: #059669; }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: var(--accent-red); color: #fff; }
        .btn-secondary { background: #1e293b; color: var(--text-secondary); }
        .btn-secondary:hover { background: #334155; color: #fff; }

        /* Table */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background: #07090e;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        tr:hover { background: var(--bg-card-hover); }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-published { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-draft { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); }

        /* Modal Editor */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-body {
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            background: #07090e;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.03em;
            color: #f8fafc;
        }

        .brand-icon-box {
            width: 34px;
            height: 34px;
            background: radial-gradient(circle at 30% 30%, #1e293b, #090d16);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 14px rgba(99, 102, 241, 0.25);
        }

        .brand-text {
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
            display: flex;
            align-items: center;
        }

        .brand-text-highlight {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-badge-tech {
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #818cf8;
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-badge-tech .pulse-dot {
            width: 5px;
            height: 5px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 6px #10b981;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <a href="/" class="brand-logo" style="text-decoration:none;">
                <div class="brand-icon-box">
                    <svg width="20" height="20" viewBox="0 0 100 100" fill="none">
                        <rect x="4" y="4" width="92" height="92" rx="24" fill="#0F172A" stroke="#6366F1" stroke-width="4"/>
                        <polygon points="50,16 80,32 80,68 50,84 20,68 20,32" fill="none" stroke="#06B6D4" stroke-width="4" stroke-dasharray="8 4"/>
                        <path d="M34 32 C34 32 34 68 34 68 C34 68 52 68 52 50 C52 32 34 32 34 32 Z" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
                        <path d="M50 32 C62 32 68 40 60 48 C68 54 64 68 48 68" fill="none" stroke="#A855F7" stroke-width="5" stroke-linecap="round"/>
                        <circle cx="50" cy="50" r="5" fill="#00F2FE"/>
                    </svg>
                </div>
                <span class="brand-text">DIGITAL<span class="brand-text-highlight">BRIEF</span></span>
                <span class="brand-badge-tech"><span class="pulse-dot"></span>CMS</span>
            </a>
            <div>
                <a href="/" class="btn btn-secondary" style="margin-right:10px;">🌐 Public Homepage</a>
                <a href="/dashboard" class="btn btn-primary">⚡ Pipeline Dashboard</a>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Articles</div>
                <div class="stat-val" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Published</div>
                <div class="stat-val" id="stat-published" style="color:var(--accent-green)">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Drafts</div>
                <div class="stat-val" id="stat-drafts" style="color:var(--accent-amber)">0</div>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <div class="filter-group">
                <input type="text" id="search-input" placeholder="Search articles..." style="width:260px;" oninput="loadArticles()">
                <select id="status-filter" onchange="loadArticles()">
                    <option value="">All Statuses</option>
                    <option value="published">Published</option>
                    <option value="draft">Drafts</option>
                </select>
                <select id="category-filter" onchange="loadArticles()">
                    <option value="">All Categories</option>
                    <option value="AI">AI</option>
                    <option value="Startups & Funding">Startups</option>
                    <option value="Cybersecurity">Cybersecurity</option>
                    <option value="Technology">Technology</option>
                    <option value="India News">India News</option>
                </select>
            </div>

            <button class="btn btn-green" onclick="openCreateModal()">➕ Create Manual Article</button>
        </div>

        <!-- Articles Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Author</th>
                        <th>Published Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="articles-tbody">
                    <tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-muted);">Loading articles...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Editor -->
    <div class="modal-overlay" id="article-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title" style="font-size:1.2rem; font-weight:800;">Edit Article</h3>
                <button onclick="closeModal()" style="background:none; border:none; color:var(--text-muted); font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label>Article Title</label>
                    <input type="text" id="edit-title" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>URL Slug</label>
                        <input type="text" id="edit-slug" placeholder="auto-generated-if-blank">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="edit-category">
                            <option value="AI">AI</option>
                            <option value="Startups & Funding">Startups & Funding</option>
                            <option value="Crypto & Web3">Crypto & Web3</option>
                            <option value="Cybersecurity">Cybersecurity</option>
                            <option value="Gadgets & Hardware">Gadgets & Hardware</option>
                            <option value="Software & Dev">Software & Dev</option>
                            <option value="Business & Finance">Business & Finance</option>
                            <option value="Technology">Technology</option>
                            <option value="India News">India News</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Status</label>
                        <select id="edit-status">
                            <option value="published">Published</option>
                            <option value="draft">Draft</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Author</label>
                        <input type="text" id="edit-author" value="DigitalBrief Editorial Desk">
                    </div>
                </div>

                <div class="form-group">
                    <label>Excerpt / Summary</label>
                    <textarea id="edit-excerpt" rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label>Article HTML Content</label>
                    <textarea id="edit-content" rows="10" style="font-family:monospace; font-size:0.85rem;"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>SEO Meta Title</label>
                        <input type="text" id="edit-seo-title">
                    </div>
                    <div class="form-group">
                        <label>Focus Keyword</label>
                        <input type="text" id="edit-focus-kw">
                    </div>
                </div>

                <div class="form-group">
                    <label>Meta Description</label>
                    <textarea id="edit-meta-desc" rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label>Featured Image URL</label>
                    <input type="text" id="edit-image">
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveArticle()">💾 Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        let currentArticles = [];

        async function loadArticles() {
            const search = document.getElementById('search-input').value;
            const status = document.getElementById('status-filter').value;
            const cat = document.getElementById('category-filter').value;

            let url = `/api/articles?limit=100`;
            if (status) url += `&status=${encodeURIComponent(status)}`;
            if (cat) url += `&category=${encodeURIComponent(cat)}`;
            if (search) url += `&search=${encodeURIComponent(search)}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                currentArticles = data.data || [];

                // Stats
                document.getElementById('stat-total').innerText = data.total || 0;
                let pubCount = currentArticles.filter(a => a.status === 'published').length;
                document.getElementById('stat-published').innerText = pubCount;
                document.getElementById('stat-drafts').innerText = (data.total || 0) - pubCount;

                // Render Table
                const tbody = document.getElementById('articles-tbody');
                if (currentArticles.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-muted);">No articles found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = currentArticles.map(art => `
                    <tr>
                        <td>
                            <strong><a href="/article/${art.slug}" target="_blank" style="color:var(--text-primary);">${art.title}</a></strong><br>
                            <span style="font-size:0.75rem; color:var(--text-muted);">/article/${art.slug}</span>
                        </td>
                        <td><span class="badge" style="background:#1e293b; color:#cbd5e1;">${art.category}</span></td>
                        <td>
                            <span class="badge ${art.status === 'published' ? 'badge-published' : 'badge-draft'}">${art.status}</span>
                        </td>
                        <td>${art.author || 'Editorial'}</td>
                        <td>${art.published_at ? art.published_at.slice(0, 10) : '-'}</td>
                        <td>
                            <button class="btn btn-secondary" style="padding:4px 10px; font-size:0.8rem;" onclick="openEditModal('${art.id}')">✏️ Edit</button>
                            <button class="btn btn-danger" style="padding:4px 10px; font-size:0.8rem;" onclick="deleteArticle('${art.id}')">🗑️</button>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Failed to load articles:", err);
            }
        }

        function openCreateModal() {
            document.getElementById('edit-id').value = '';
            document.getElementById('modal-title').innerText = 'Create New Manual Article';
            document.getElementById('edit-title').value = '';
            document.getElementById('edit-slug').value = '';
            document.getElementById('edit-category').value = 'Technology';
            document.getElementById('edit-status').value = 'published';
            document.getElementById('edit-author').value = 'DigitalBrief Editorial Desk';
            document.getElementById('edit-excerpt').value = '';
            document.getElementById('edit-content').value = '<p>Write your article content here...</p>';
            document.getElementById('edit-seo-title').value = '';
            document.getElementById('edit-focus-kw').value = '';
            document.getElementById('edit-meta-desc').value = '';
            document.getElementById('edit-image').value = '';

            document.getElementById('article-modal').classList.add('active');
        }

        function openEditModal(id) {
            const art = currentArticles.find(a => String(a.id) === String(id));
            if (!art) return;

            document.getElementById('edit-id').value = art.id;
            document.getElementById('modal-title').innerText = 'Edit Article';
            document.getElementById('edit-title').value = art.title || '';
            document.getElementById('edit-slug').value = art.slug || '';
            document.getElementById('edit-category').value = art.category || 'Technology';
            document.getElementById('edit-status').value = art.status || 'published';
            document.getElementById('edit-author').value = art.author || 'DigitalBrief Editorial Desk';
            document.getElementById('edit-excerpt').value = art.excerpt || '';
            document.getElementById('edit-content').value = art.content || '';
            document.getElementById('edit-seo-title').value = art.seo_title || '';
            document.getElementById('edit-focus-kw').value = art.focus_keyword || '';
            document.getElementById('edit-meta-desc').value = art.meta_description || '';
            document.getElementById('edit-image').value = art.featured_image || '';

            document.getElementById('article-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('article-modal').classList.remove('active');
        }

        async function saveArticle() {
            const id = document.getElementById('edit-id').value;
            const payload = {
                title: document.getElementById('edit-title').value,
                slug: document.getElementById('edit-slug').value,
                category: document.getElementById('edit-category').value,
                status: document.getElementById('edit-status').value,
                author: document.getElementById('edit-author').value,
                excerpt: document.getElementById('edit-excerpt').value,
                content: document.getElementById('edit-content').value,
                seo_title: document.getElementById('edit-seo-title').value,
                focus_keyword: document.getElementById('edit-focus-kw').value,
                meta_description: document.getElementById('edit-meta-desc').value,
                featured_image: document.getElementById('edit-image').value,
            };

            if (!payload.title) {
                alert("Article Title is required!");
                return;
            }

            try {
                let res;
                if (id) {
                    // Update
                    res = await fetch(`/api/articles/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    // Create
                    res = await fetch(`/api/articles`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }

                if (res.ok) {
                    closeModal();
                    loadArticles();
                } else {
                    alert("Failed to save article");
                }
            } catch (err) {
                console.error("Save error:", err);
                alert("Error saving article");
            }
        }

        async function deleteArticle(id) {
            if (!confirm("Are you sure you want to delete this article?")) return;

            try {
                const res = await fetch(`/api/articles/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadArticles();
                } else {
                    alert("Failed to delete article");
                }
            } catch (err) {
                console.error("Delete error:", err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Wait brief moment for Supabase auth to initialize
            setTimeout(() => {
                if (!window.isAdminUser || !window.isAdminUser()) {
                    document.body.innerHTML = `
                        <div style="min-height:100vh; background:#07090e; display:flex; align-items:center; justify-content:center; font-family:sans-serif; padding:20px;">
                            <div style="background:#0e131f; border:1px solid #ef4444; border-radius:16px; padding:40px; max-width:480px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.8);">
                                <div style="font-size:3rem; margin-bottom:16px;">🚫</div>
                                <h1 style="color:#ef4444; font-size:1.6rem; font-weight:800; margin-bottom:12px;">403 - Admin Access Restricted</h1>
                                <p style="color:#cbd5e1; font-size:0.95rem; line-height:1.6; margin-bottom:24px;">
                                    The Admin Content Management System is strictly reserved for the site administrator (<strong>j.parganiha@gmail.com</strong>).
                                </p>
                                <div style="display:flex; gap:12px; justify-content:center;">
                                    <button onclick="openAuthModal()" style="background:#6366f1; color:#fff; border:none; padding:10px 18px; border-radius:8px; font-weight:700; cursor:pointer;">🔐 Login as Admin</button>
                                    <a href="/" style="background:#1e293b; color:#cbd5e1; text-decoration:none; padding:10px 18px; border-radius:8px; font-weight:600;">Return Home</a>
                                </div>
                            </div>
                        </div>
                    `;
                    return;
                }
                loadArticles();
            }, 400);
        });
    </script>
</body>
</html>
