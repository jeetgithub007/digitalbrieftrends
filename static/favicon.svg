<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#1a1a22"/>
    </linearGradient>
    <linearGradient id="line" x1="8" y1="52" x2="56" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#232636" stroke-width="1.5"/>

  <!-- Trend line — stylized going up -->
  <polyline points="10,46 22,46 28,30 34,38 42,18 48,24 54,14"
            stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
            fill="none" filter="url(#glow)"/>

  <!-- Endpoint dot -->
  <circle cx="54" cy="14" r="3.5" fill="url(#dot)" filter="url(#glow)"/>

  <!-- Small accent dots along path -->
  <circle cx="10" cy="46" r="1.5" fill="#6366f1" opacity="0.6"/>
  <circle cx="28" cy="30" r="1.5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="42" cy="18" r="1.8" fill="#a855f7" opacity="0.7"/>
</svg>
